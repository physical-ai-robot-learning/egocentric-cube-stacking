name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for OpenCV / Qt wheels
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libxkbcommon0
      - name: Byte-compile every Python file (src, scripts, analysis, tests and archive)
        run: python -m compileall -q -x '/\.git/' .
      - name: Claims check (every number in the README, docs/history.md and the technical report)
        run: |
          pip install pyyaml numpy
          python analysis/verify_claims.py
      - name: Install (package + collector extra + CPU torch / flask / pinocchio for the deploy tests)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[collector,dev]" flask requests pin pin-pink
      - name: Package tests (characterization tests in src/<pkg>/tests) and the CART20 contract tests
        run: pytest -q src tests/cart20
      - name: reBot UI against its golden record
        run: pytest -q tests/test_ui_routes.py
      - name: Import smoke test (every module under src/ imports from a clean checkout)
        run: pytest -q tests/test_imports.py
