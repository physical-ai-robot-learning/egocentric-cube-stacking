# One installable project for the whole repository (src layout). Install: `pip install -e ".[collector,dev]"`.
# Packages = the pipeline stages (README "Pipeline"): handumi_collector (+ ego_collector.camera) capture, mast3r_pose pose,
# ego_cart20 / rebot_prep conversion, training, rebot_deploy deployment; ego_paths = machine-specific roots; umi = UMI
# pose_util stand-in. Superseded and exploratory code is in archive/ (not packaged).
[project]
name = "egocentric-cube-stacking"
version = "0.1.0"
description = "HandUMI egocentric bimanual demonstrations -> reBot B601 / X-VLA: collection, pose, dataset, retargeting, training and deployment code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "opencv-contrib-python>=4.10,<5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# HandUMI raw collector (src/handumi_collector); was the core dependency list of collection/pyproject.toml
collector = [
    "mcap>=1.2",
    "pyserial>=3.5",
    "PySide6>=6.7",
    "feetech-servo-sdk>=1.0.0",
    "av>=12",
    "trimesh>=4.0",
]
# The archived V0 collector and wearable teleop (archive/) needed `mediapipe`, `pupil-apriltags`, `rerun-sdk` and
# `dex-retargeting`; their extras were removed with them (2026-11-05). The head RGB-D camera needs `pyorbbecsdk` (by hand).
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/handumi_collector",
    "src/ego_collector",
    "src/ego_cart20",
    "src/mast3r_pose",
    "src/rebot_prep",
    "src/rebot_deploy",
    "src/training",
    "src/ego_paths",
    "src/umi",
]

[tool.pytest.ini_options]
# `src` on the path so the tests also run from a plain checkout without `pip install -e .`
pythonpath = ["src", "."]
testpaths = ["tests", "src"]
# archive/ holds verbatim superseded code and its old tests; they are not collected
norecursedirs = ["archive", ".git", "*.egg-info"]
